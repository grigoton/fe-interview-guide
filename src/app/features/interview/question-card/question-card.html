<article class="card" [class]="'is-' + status()" [class.is-open]="expanded()">
  <div class="card-row">
    <button
      type="button"
      class="card-head"
      (click)="toggle()"
      [attr.aria-expanded]="expanded()"
      [attr.aria-controls]="'answer-' + question().id"
    >
      <span class="q-num">#{{ number() }}</span>
      <span class="q-text">{{ question().question[locale()] }}</span>
      <span class="q-cat">{{ 'INT_CAT_' + question().category | translate }}</span>
      <span class="lvl" [class]="levelClass()">{{ question().level }}</span>
      <span class="chev" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </span>
    </button>

    <!-- Kept out of the toggle button (no nested buttons); revealed on hover,
         focus or when a status is already set, so a resting row stays clean. -->
    <button
      type="button"
      class="copy-q"
      [class.is-copied]="questionCopied()"
      [attr.aria-label]="'INT_COPY_QUESTION' | translate"
      [title]="(questionCopied() ? 'INT_COPIED' : 'INT_COPY_QUESTION') | translate"
      (click)="copyQuestion($event)"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        @if (questionCopied()) {
          <path d="m20 6-11 11-5-5" />
        } @else {
          <rect x="9" y="9" width="11" height="11" rx="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        }
      </svg>
    </button>

    <div class="status-controls">
      <button
        type="button"
        class="status-btn status-btn--learning"
        [class.is-active]="status() === 'learning'"
        [attr.aria-pressed]="status() === 'learning'"
        (click)="setStatus('learning', $event)"
      >
        {{ 'INT_STATUS_LEARNING' | translate }}
      </button>
      <button
        type="button"
        class="status-btn status-btn--known"
        [class.is-active]="status() === 'known'"
        [attr.aria-pressed]="status() === 'known'"
        (click)="setStatus('known', $event)"
      >
        {{ 'INT_STATUS_KNOWN' | translate }}
      </button>
    </div>
  </div>

  @if (expanded()) {
    <div class="card-body" [id]="'answer-' + question().id">
      <div class="tags">
        @for (tag of question().tags; track tag) {
          <span class="tag">{{ tag }}</span>
        }
      </div>

      <!-- Copy buttons rendered by MarkdownPipe are handled by delegation. -->
      <div
        class="md-content"
        (click)="onAnswerClick($event)"
        [innerHTML]="question().answer[locale()] | markdown: ('INT_COPY' | translate)"
      ></div>

      @if (question().codeSnippet; as snippet) {
        <div class="snippet">
          <div class="snippet-head">
            <span class="snippet-label">{{ 'INT_CODE_EXAMPLE' | translate }}</span>
            <button
              type="button"
              class="snippet-copy"
              [class.is-copied]="snippetCopied()"
              (click)="copySnippet()"
            >
              {{ (snippetCopied() ? 'INT_COPIED' : 'INT_COPY') | translate }}
            </button>
          </div>
          <pre><code>{{ snippet }}</code></pre>
        </div>
      }

      <!-- Read to the end? Close it from here instead of scrolling back up —
           or decide "learning" / "known" and go straight to the next question. -->
      <div class="card-foot">
        <button type="button" class="ui-btn foot-btn" (click)="collapse()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m6 15 6-6 6 6" />
          </svg>
          {{ 'INT_COLLAPSE' | translate }}
        </button>
        <button
          type="button"
          class="ui-btn foot-btn foot-btn--learning"
          [title]="'INT_NEXT_LEARNING_HINT' | translate"
          (click)="advance('learning')"
        >
          {{ 'INT_NEXT_LEARNING' | translate }}
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </button>
        <button
          type="button"
          class="ui-btn foot-btn foot-btn--known"
          [title]="'INT_NEXT_KNOWN_HINT' | translate"
          (click)="advance('known')"
        >
          {{ 'INT_NEXT_KNOWN' | translate }}
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </button>
      </div>
    </div>
  }
</article>
