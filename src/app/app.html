<!-- Purely decorative gradient backdrop; replaces the old 29 MB video layer. -->
<div class="aurora" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="m8 6-6 6 6 6" />
          <path d="m16 6 6 6-6 6" />
        </svg>
      </span>
      <span class="brand-text">{{ 'APP_TITLE' | translate }}</span>
    </a>

    <nav class="nav" [attr.aria-label]="'ARIA_MAIN_NAV' | translate">
      <a
        class="nav-link"
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        {{ 'NAV_INTERVIEW' | translate }}
      </a>
      <a class="nav-link" routerLink="/notes" routerLinkActive="is-active">
        {{ 'NAV_NOTES' | translate }}
      </a>
    </nav>

    <div class="topbar-actions">
      <button
        type="button"
        class="ui-icon-btn"
        (click)="locale.toggleLocale()"
        [attr.aria-label]="'ARIA_TOGGLE_LANG' | translate"
        [attr.title]="'ARIA_TOGGLE_LANG' | translate"
      >
        {{ locale.currentLocale() === 'ru' ? 'EN' : 'RU' }}
      </button>

      <button
        type="button"
        class="ui-icon-btn"
        (click)="toggleTheme()"
        [attr.aria-label]="
          (theme() === 'dark' ? 'ARIA_TOGGLE_THEME' : 'ARIA_TOGGLE_THEME_DARK') | translate
        "
        [attr.title]="
          (theme() === 'dark' ? 'ARIA_TOGGLE_THEME' : 'ARIA_TOGGLE_THEME_DARK') | translate
        "
      >
        @if (theme() === 'dark') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6.4 6.4 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
        }
      </button>
    </div>
  </div>
</header>

<main class="shell-main">
  <router-outlet />
</main>
